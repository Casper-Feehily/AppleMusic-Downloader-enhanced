# ─────────────────────────────────────────────────────────────────
# AppleMusic Downloader — Cross-platform Build & Release
#
# Triggers:
#   - push / pull_request to master
#   - pushing a tag v*  (e.g. v2.0.0) → creates a GitHub Release
# ─────────────────────────────────────────────────────────────────

name: Build & Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: 20

jobs:
  # ─────────────────────────────────────────────────────────────
  # Lint & Test (fast, runs first)
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[desktop]"

      - name: Python regression tests
        run: python -m unittest discover -s tests -v

      - name: Install frontend deps
        working-directory: src/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: src/frontend
        run: npx tsc --noEmit

      - name: Frontend regression tests
        working-directory: src/frontend
        run: npm test

  # ─────────────────────────────────────────────────────────────
  # CLI wheel and source distribution
  # ─────────────────────────────────────────────────────────────
  cli:
    name: Build CLI package
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build and validate CLI distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python -m pip install dist/*.whl
          amdl --version
          amdl --help
      - uses: actions/upload-artifact@v4
        with:
          name: applemusic-dl-cli
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Build matrix: macOS · Windows
  # ─────────────────────────────────────────────────────────────
  build:
    name: "Build (${{ matrix.os }})"
    needs: [lint]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-15
            artifact: AppleMusicDownloader-macos-arm64
            artifact_path: dist/AppleMusicDownloader-macos-arm64.dmg
          - os: windows
            runner: windows-latest
            artifact: AppleMusicDownloader-windows-x64
            artifact_path: dist/AppleMusicDownloader-Setup-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build
        shell: bash
        env:
          BUILD_OS: ${{ matrix.os }}
        run: bash scripts/build.sh "$BUILD_OS"

      - name: Verify bundled FFmpeg (macOS)
        if: matrix.os == 'macos'
        run: |
          test -x dist/AppleMusicDownloader-macos-arm64.app/Contents/Frameworks/bin/ffmpeg
          test -f dist/AppleMusicDownloader-macos-arm64.app/Contents/Resources/third_party/ffmpeg/LICENSE
          dist/AppleMusicDownloader-macos-arm64.app/Contents/Frameworks/bin/ffmpeg -version
          codesign --verify --deep --strict dist/AppleMusicDownloader-macos-arm64.app

      - name: Run full platform regression suite (including native update helpers)
        run: python -m unittest discover -s tests -v

      - name: Verify bundled FFmpeg (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ffmpeg = 'dist/AppleMusicDownloader-windows-x64/bin/ffmpeg.exe'
          if (-not (Test-Path $ffmpeg)) { throw "Bundled ffmpeg.exe is missing" }
          & $ffmpeg -version
          if (-not (Test-Path 'dist/AppleMusicDownloader-windows-x64/third_party/ffmpeg/LICENSE')) { throw "FFmpeg license is missing" }

      - name: Build Windows installer
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path src/amdl/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" scripts/windows-installer.iss

      - name: Verify Windows installer contents
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $installer = Resolve-Path 'dist/AppleMusicDownloader-Setup-windows-x64.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'amdl-install-check'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode)" }
          $ffmpeg = Join-Path $installDir 'bin/ffmpeg.exe'
          if (-not (Test-Path $ffmpeg)) { throw "Installed app does not contain FFmpeg" }
          & $ffmpeg -version
          if (-not (Test-Path (Join-Path $installDir 'third_party/ffmpeg/LICENSE'))) { throw "Installed app does not contain the FFmpeg license" }

      - name: Smoke test installed Windows application
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseUrl = 'http://127.0.0.1:8000'
          if (Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Port 8000 is already occupied before the installed app test'
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'amdl-install-check'
          $appProcess = Start-Process -FilePath (Join-Path $installDir 'AppleMusicDownloader.exe') -WorkingDirectory $installDir -PassThru
          try {
            $health = $null
            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline) {
              if ($appProcess.HasExited) { throw "Installed application exited with code $($appProcess.ExitCode)" }
              try {
                $health = Invoke-RestMethod "$baseUrl/api/health" -TimeoutSec 3
                break
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            if (-not $health) { throw 'Installed application did not start its API within 90 seconds' }
            $expectedVersion = (Select-String -Path src/amdl/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
            if ($health.version -ne $expectedVersion) { throw "Unexpected app version $($health.version)" }
            $info = Invoke-RestMethod "$baseUrl/api/info" -TimeoutSec 5
            if ('alac' -notin $info.supported_codecs_song.value) { throw 'Installed app is missing ALAC support' }
            $page = Invoke-WebRequest "$baseUrl/" -TimeoutSec 5
            $asset = [regex]::Match($page.Content, 'src="(/_next/[^"]+\.js[^"]*)"').Groups[1].Value
            if (-not $asset) { throw 'Installed app did not serve the built frontend' }
            $assetResponse = Invoke-WebRequest "$baseUrl$asset" -TimeoutSec 5
            if ($assetResponse.StatusCode -ne 200 -or $assetResponse.RawContentLength -eq 0) { throw 'Installed frontend asset could not be loaded' }
            Write-Output "Installed app startup, API, ALAC options and frontend assets passed for $($health.version)"
          } finally {
            if (-not $appProcess.HasExited) {
              & taskkill /PID $appProcess.Id /T /F | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Could not stop the installed application after testing' }
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Release (only on tag push v*)
  # ─────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build, cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Include standalone Wrapper fixes and checksums
        run: |
          mkdir -p release-artifacts/wrapper-fixes
          cp src/amdl/wrapper_patches.py release-artifacts/wrapper-fixes/
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('release-artifacts')
          files = sorted(path for path in root.rglob('*') if path.is_file())
          names = [path.name for path in files]
          if len(names) != len(set(names)):
              raise SystemExit('Duplicate release asset names')
          (root / 'SHA256SUMS.txt').write_text(''.join(
              f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n'
              for path in files
          ), encoding='utf-8')
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AppleMusic Downloader ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            Windows and Apple Silicon macOS installers include FFmpeg from [eugeneware/ffmpeg-static b6.1.1](https://github.com/eugeneware/ffmpeg-static/releases/tag/b6.1.1). License and build information are included under `third_party/ffmpeg/`; see [FFmpeg Legal](https://ffmpeg.org/legal.html).
          draft: true
          prerelease: false
          files: |
            release-artifacts/**/*
