# ─────────────────────────────────────────────────────────────────
# AppleMusic Downloader — Cross-platform Build & Release
#
# Triggers:
#   - push / pull_request to master
#   - pushing a tag v*  (e.g. v2.0.0) → creates a GitHub Release
# ─────────────────────────────────────────────────────────────────

name: Build & Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: 20

jobs:
  # ─────────────────────────────────────────────────────────────
  # Lint & Test (fast, runs first)
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/fronted/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[desktop]"

      - name: Install frontend deps
        working-directory: src/fronted
        run: npm ci

      - name: Lint frontend
        working-directory: src/fronted
        run: npm run lint

      - name: TypeScript check
        working-directory: src/fronted
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────
  # Build matrix: macOS · Windows
  # ─────────────────────────────────────────────────────────────
  build:
    name: "Build (${{ matrix.os }})"
    needs: [lint]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-14
            artifact: AppleMusicDownloader-macos-arm64
            artifact_path: dist/AppleMusicDownloader-macos-arm64.dmg
          - os: windows
            runner: windows-latest
            artifact: AppleMusicDownloader-windows-x64
            artifact_path: dist/AppleMusicDownloader-Setup-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/fronted/package-lock.json

      - name: Build
        shell: bash
        env:
          BUILD_OS: ${{ matrix.os }}
        run: bash scripts/build.sh "$BUILD_OS"

      - name: Verify bundled FFmpeg (macOS)
        if: matrix.os == 'macos'
        run: |
          test -x dist/AppleMusicDownloader-macos-arm64.app/Contents/Frameworks/bin/ffmpeg
          test -f dist/AppleMusicDownloader-macos-arm64.app/Contents/Resources/third_party/ffmpeg/LICENSE
          dist/AppleMusicDownloader-macos-arm64.app/Contents/Frameworks/bin/ffmpeg -version
          codesign --verify --deep --strict dist/AppleMusicDownloader-macos-arm64.app

      - name: Verify bundled FFmpeg (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ffmpeg = 'dist/AppleMusicDownloader-windows-x64/bin/ffmpeg.exe'
          if (-not (Test-Path $ffmpeg)) { throw "Bundled ffmpeg.exe is missing" }
          & $ffmpeg -version
          if (-not (Test-Path 'dist/AppleMusicDownloader-windows-x64/third_party/ffmpeg/LICENSE')) { throw "FFmpeg license is missing" }

      - name: Build Windows installer
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path src/amdl/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" scripts/windows-installer.iss

      - name: Verify Windows installer contents
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $listing = & 7z l dist/AppleMusicDownloader-Setup-windows-x64.exe
          if ($listing -notmatch 'bin\\ffmpeg.exe') { throw "Installer does not contain FFmpeg" }
          if ($listing -notmatch 'third_party\\ffmpeg\\LICENSE') { throw "Installer does not contain the FFmpeg license" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Release (only on tag push v*)
  # ─────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AppleMusic Downloader ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            Windows and Apple Silicon macOS installers include FFmpeg from [eugeneware/ffmpeg-static b6.1.1](https://github.com/eugeneware/ffmpeg-static/releases/tag/b6.1.1). License and build information are included under `third_party/ffmpeg/`; see [FFmpeg Legal](https://ffmpeg.org/legal.html).
          draft: true
          prerelease: false
          files: |
            release-artifacts/**/*
