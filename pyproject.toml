[project]
name = "applemusic-dl"
description = "一个功能强大的 Apple Music 下载工具，支持下载歌曲、音乐视频。"
requires-python = ">=3.10"
authors = [{ name = "wenfeng110402" }]
dependencies = [
    "gamdl~=3.8.5",
    "click>=8.0",
    "colorama",
    "pillow",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "httpx-retries>=0.6.0",
    "certifi",
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-UNLICENSE"]
dynamic = ["version"]

[project.optional-dependencies]
desktop = [
    "pywebview",
]

[project.urls]
homepage = "https://github.com/Casper-Feehily/AppleMusic-Downloader-enhanced"
repository = "https://github.com/Casper-Feehily/AppleMusic-Downloader-enhanced"

[build-system]
requires = ["flit_core>=3.11,<5"]
build-backend = "flit_core.buildapi"

[project.scripts]
amdl = "amdl.cli:main"

[tool.flit.module]
name = "amdl"
